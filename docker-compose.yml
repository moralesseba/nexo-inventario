# Orquestación local: aplicación NEXO inventario + base de datos PostgreSQL.
# Levanta todo el entorno con:  docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo_inventario
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo_inventario"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: nexo
      DB_PASSWORD: nexo
      DB_NAME: nexo_inventario
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
